name: CI
on:
  push:
    branches: [main-2]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Same fast gate as the pre-commit hook: JS syntax.
      - run: npm run check
      # Full browser suite (~5.5 min, too slow for a per-commit hook).
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
