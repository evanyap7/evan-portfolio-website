<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portfolio checks</title>
  <style>
    body { margin: 16px; font: 13px/1.45 ui-monospace, Menlo, monospace; }
    table { border-collapse: collapse; }
    td { padding: 2px 12px 2px 0; border-bottom: 1px solid #e5e5e5; vertical-align: top; }
    .pass td:first-child { color: #1a7f37; }
    .fail { color: #b00020; }
    /* The frames sit on screen but invisible, so IntersectionObserver inside
       them (reveals, counters, title reveals, the timeline) behaves as it
       does for a visitor. */
    .frames { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <h1 data-summary>Running…</h1>
  <table data-table></table>
  <div class="frames" data-frames></div>
  <script type="module" src="run.js"></script>
</body>
</html>
